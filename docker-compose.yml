version: '3.8'

services:
  mssql-telemetry:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-legacy
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_ADMIN_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data: